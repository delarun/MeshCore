; ESP32-C3 (SuperMini) + Ebyte E80-900M2213S (LR1121, sub-GHz side only).
; Reuses the LR1121 target code from variants/esp32_e80 -- only the board
; and pin mapping differ.
;
; Wiring (C3 SuperMini GPIO -> E80):
;   GPIO4 -> SCK       GPIO7  -> NSS
;   GPIO5 -> MISO      GPIO3  -> NRST
;   GPIO6 -> MOSI      GPIO10 -> BUSY
;   GPIO2 -> DIO9 (IRQ)
; Optional SSD1306 OLED: SDA=0, SCL=1, addr 0x3C (auto-detected).
; The BOOT button (GPIO9) drives the companion UI.
;
; Console/CLI is on the SuperMini's native USB port.
; First flash: hold BOOT while plugging USB, then pio run -e ... -t upload

[ESP32C3_E80]
extends = esp32_base
board = esp32-c3-devkitm-1
board_build.partitions = min_spiffs.csv ; BLE companion needs a >1.25MB app partition
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_e80
  -D ESP32C3_E80
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D P_LORA_SCLK=4
  -D P_LORA_MISO=5
  -D P_LORA_MOSI=6
  -D P_LORA_NSS=7
  -D P_LORA_RESET=3
  -D P_LORA_BUSY=10
  -D P_LORA_DIO_1=2
  -D LR11X0_DIO_AS_RF_SWITCH=true
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.8
  -D RX_BOOSTED_GAIN=true
  -D PIN_BOARD_SDA=0
  -D PIN_BOARD_SCL=1
  -D RADIO_CLASS=CustomLR1121
  -D USE_LR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D LORA_TX_POWER=22
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=9
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../variants/esp32_e80>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:ESP32C3_E80_repeater]
extends = ESP32C3_E80
build_src_filter = ${ESP32C3_E80.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${ESP32C3_E80.build_flags}
  -D ADVERT_NAME='"C3 E80 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${ESP32C3_E80.lib_deps}
  ${esp32_ota.lib_deps}

[env:ESP32C3_E80_room_server]
extends = ESP32C3_E80
build_src_filter = ${ESP32C3_E80.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${ESP32C3_E80.build_flags}
  -D ADVERT_NAME='"C3 E80 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
lib_deps =
  ${ESP32C3_E80.lib_deps}
  ${esp32_ota.lib_deps}

; companion over Bluetooth (pairing pin 123456 by default)
[env:ESP32C3_E80_companion_radio_ble]
extends = ESP32C3_E80
build_src_filter = ${ESP32C3_E80.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
build_flags =
  ${ESP32C3_E80.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=64
lib_deps =
  ${ESP32C3_E80.lib_deps}
  densaugeo/base64 @ ~1.4.0

; companion over WiFi (the app connects to <board-ip>:5000)
[env:ESP32C3_E80_companion_radio_wifi]
extends = ESP32C3_E80
build_src_filter = ${ESP32C3_E80.build_src_filter}
  +<helpers/esp32/SerialWifiInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
build_flags =
  ${ESP32C3_E80.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=64
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
lib_deps =
  ${ESP32C3_E80.lib_deps}
  densaugeo/base64 @ ~1.4.0
