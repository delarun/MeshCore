; Classic ESP32 devkit + Ebyte E80-900M2213S (LR1121, dual-band; these envs
; use the sub-GHz side only -- 22 dBm via the RFO_HP path).
;
; Wiring (ESP32 devkit GPIO -> E80):
;   GPIO18 -> SCK      GPIO5  -> NSS
;   GPIO19 -> MISO     GPIO26 -> NRST
;   GPIO23 -> MOSI     GPIO32 -> BUSY
;   GPIO33 -> DIO9 (IRQ)
; No TXEN/RXEN: the LR1121 drives the module's RF switch itself (DIO5/DIO6,
; configured in target.cpp -- the E80 does not follow the Semtech reference).
; Optional SSD1306 OLED on I2C: SDA=21, SCL=22, addr 0x3C (auto-detected).
; E22-style power note applies: feed the module from a solid 3.3V source.

[ESP32_E80]
extends = esp32_base
board = esp32doit-devkit-v1
board_build.partitions = min_spiffs.csv ; BLE companion needs a >1.25MB app partition
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32_e80
  -D ESP32_E80
  -D P_LORA_TX_LED=2
  -D P_LORA_SCLK=18
  -D P_LORA_MISO=19
  -D P_LORA_MOSI=23
  -D P_LORA_NSS=5
  -D P_LORA_RESET=26
  -D P_LORA_BUSY=32
  -D P_LORA_DIO_1=33
  -D LR11X0_DIO_AS_RF_SWITCH=true
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.8
  -D RX_BOOSTED_GAIN=true
  -D PIN_BOARD_SDA=21
  -D PIN_BOARD_SCL=22
  -D RADIO_CLASS=CustomLR1121
  -D USE_LR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D LORA_TX_POWER=22
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=0
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../variants/esp32_e80>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:ESP32_E80_repeater]
extends = ESP32_E80
build_src_filter = ${ESP32_E80.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${ESP32_E80.build_flags}
  -D ADVERT_NAME='"E80 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${ESP32_E80.lib_deps}
  ${esp32_ota.lib_deps}

[env:ESP32_E80_room_server]
extends = ESP32_E80
build_src_filter = ${ESP32_E80.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${ESP32_E80.build_flags}
  -D ADVERT_NAME='"E80 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
lib_deps =
  ${ESP32_E80.lib_deps}
  ${esp32_ota.lib_deps}

; companion over Bluetooth (pairing pin 123456 by default)
[env:ESP32_E80_companion_radio_ble]
extends = ESP32_E80
build_src_filter = ${ESP32_E80.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
build_flags =
  ${ESP32_E80.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=128
lib_deps =
  ${ESP32_E80.lib_deps}
  densaugeo/base64 @ ~1.4.0

; companion over WiFi (the app connects to <board-ip>:5000)
[env:ESP32_E80_companion_radio_wifi]
extends = ESP32_E80
build_src_filter = ${ESP32_E80.build_src_filter}
  +<helpers/esp32/SerialWifiInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
build_flags =
  ${ESP32_E80.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=160
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=128
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
lib_deps =
  ${ESP32_E80.lib_deps}
  densaugeo/base64 @ ~1.4.0
