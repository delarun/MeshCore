; Linux-native (portduino) node, radio attached via CH341A USB-SPI adapter.
;
; Default wiring for an Ebyte E22-900M30S (SX1262 + 1W PA), CH341 GPIO numbers:
;   CH341 D0 (CS0#, chip pin 15)  -> E22 NSS
;   CH341 D3 (DCK,  chip pin 18)  -> E22 SCK
;   CH341 D5 (DOUT, chip pin 20)  -> E22 MOSI
;   CH341 D7 (DIN,  chip pin 22)  -> E22 MISO
;   CH341 D1 (CS1#, chip pin 16)  -> E22 RXEN
;   CH341 D2 (CS2#, chip pin 17)  -> E22 NRST
;   CH341 D4 (DOUT2, chip pin 19) -> E22 BUSY
;   CH341 D6 (DIN2, chip pin 21)  -> E22 DIO1
;   E22 TXEN -> E22 DIO2 (radio switches the PA itself, SX126X_DIO2_AS_RF_SWITCH)
; NOTE: E22 is a 3.3V device; power the module from a separate 3.3V supply
; able to deliver the PA current (>=700mA), common GND with the adapter.
;
; The USB device is matched by VID/PID (default 0x1A86/0x5512); if several
; adapters are connected, select one with the MESHCORE_CH341_SERIAL env var.

[Native_CH341]
extends = portduino_base
build_flags =
  ${portduino_base.build_flags}
  -I variants/native_ch341
  -D NATIVE_CH341
  -D P_LORA_NSS=0
  -D P_LORA_DIO_1=6
  -D P_LORA_RESET=2
  -D P_LORA_BUSY=4
  -D SX126X_RXEN=1
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${portduino_base.build_src_filter}
  +<../variants/native_ch341>
  -<../variants/native_ch341/tools/>

[env:Native_CH341_repeater]
extends = Native_CH341
build_src_filter = ${Native_CH341.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Native_CH341.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D ADVERT_NAME='"Linux Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1

; Companion node: the MeshCore phone app connects over the LAN
; (in the app: add node via WiFi, host = this machine's IP, port 5000)
[env:Native_CH341_companion_wifi]
extends = Native_CH341
build_src_filter = ${Native_CH341.build_src_filter}
  +<helpers/portduino/*.cpp>
  +<../examples/companion_radio/*.cpp>
build_flags =
  ${Native_CH341.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D TCP_PORT=5000
;  -D WIFI_DEBUG_LOGGING=1
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${Native_CH341.lib_deps}
  densaugeo/base64 @ ~1.4.0

; Cross-build of the companion for OpenWrt (musl) routers, e.g. mipsel_24kc.
; The toolchain comes from an OpenWrt SDK via TARGET_* environment variables --
; use variants/native_ch341/build_openwrt.sh, don't run this env directly.
[env:Native_CH341_companion_wifi_openwrt]
extends = env:Native_CH341_companion_wifi
board = buildroot

[env:Native_CH341_room_server]
extends = Native_CH341
build_src_filter = ${Native_CH341.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${Native_CH341.build_flags}
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D ADVERT_NAME='"Linux Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
