; ESP32-S2 (Lolin/Wemos S2 mini) + Ebyte E22-900M30S (SX1262 + 1W PA).
; NOTE: the S2 has no Bluetooth, so the companion is WiFi (TCP) or USB only.
;
; Wiring (S2 mini GPIO -> E22):
;   GPIO7  -> SCK      GPIO12 -> NSS
;   GPIO9  -> MISO     GPIO10 -> NRST
;   GPIO11 -> MOSI     GPIO13 -> BUSY
;   GPIO14 -> DIO1     GPIO16 -> RXEN
;   E22 TXEN -> E22 DIO2 (jumper on the module; radio switches the PA itself)
; Power the E22 from a 3.3V source able to deliver >=700mA (not the S2 mini's
; regulator), common GND.
;
; First flash: hold button "0" while plugging USB (bootloader), then
;   pio run -e ESP32S2_E22_repeater -t upload

[ESP32S2_E22]
extends = esp32_base
board = lolin_s2_mini
build_flags =
  ${esp32_base.build_flags}
  -I variants/esp32s2_e22
  -D ESP32S2_E22
  -D P_LORA_TX_LED=15
  -D P_LORA_SCLK=8
  -D P_LORA_MISO=9
  -D P_LORA_MOSI=10
  -D P_LORA_NSS=7
  -D P_LORA_RESET=11
  -D P_LORA_BUSY=13
  -D P_LORA_DIO_1=12
  -D SX126X_RXEN=33
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D PIN_BOARD_SDA=34
  -D PIN_BOARD_SCL=35
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  ; optional SSD1306 128x64 OLED on the I2C pins (SDA=34, SCL=35, addr 0x3C);
  ; auto-detected at boot, the node runs headless if absent
  -D DISPLAY_CLASS=SSD1306Display
  -D PIN_OLED_RESET=-1
  -D PIN_USER_BTN=0
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../variants/esp32s2_e22>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:ESP32S2_E22_repeater]
extends = ESP32S2_E22
build_src_filter = ${ESP32S2_E22.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${ESP32S2_E22.build_flags}
  -D ADVERT_NAME='"S2 E22 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
;  -D MESH_PACKET_LOGGING=1
;  -D MESH_DEBUG=1
lib_deps =
  ${ESP32S2_E22.lib_deps}
  ${esp32_ota.lib_deps}

[env:ESP32S2_E22_room_server]
extends = ESP32S2_E22
build_src_filter = ${ESP32S2_E22.build_src_filter}
  +<../examples/simple_room_server/*.cpp>
build_flags =
  ${ESP32S2_E22.build_flags}
  -D ADVERT_NAME='"S2 E22 Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
lib_deps =
  ${ESP32S2_E22.lib_deps}
  ${esp32_ota.lib_deps}

; companion over native USB (the MeshCore app connects via USB-OTG cable)
[env:ESP32S2_E22_companion_radio_usb]
extends = ESP32S2_E22
build_src_filter = ${ESP32S2_E22.build_src_filter}
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
build_flags =
  ${ESP32S2_E22.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=256
lib_deps =
  ${ESP32S2_E22.lib_deps}
  densaugeo/base64 @ ~1.4.0

; companion over WiFi (the app connects to <board-ip>:5000)
[env:ESP32S2_E22_companion_radio_wifi]
extends = ESP32S2_E22
build_src_filter = ${ESP32S2_E22.build_src_filter}
  +<helpers/esp32/SerialWifiInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
build_flags =
  ${ESP32S2_E22.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  ; smaller than the USB build: the S2's DRAM doesn't fit 256 queue slots
  ; alongside the WiFi stack
  -D OFFLINE_QUEUE_SIZE=64
  -D WIFI_SSID='"myssid"'
  -D WIFI_PWD='"mypwd"'
;  -D WIFI_DEBUG_LOGGING=1
lib_deps =
  ${ESP32S2_E22.lib_deps}
  densaugeo/base64 @ ~1.4.0
